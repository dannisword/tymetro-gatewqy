version: '3.8'

services:
  # 1. Mosquitto MQTT Broker (開放 1883 埠)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: tymetro-mosquitto
    restart: always
    environment:
      - TZ=Asia/Taipei
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto-data:/mosquitto/data
    security_opt:
      - seccomp:unconfined
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. HVAC Edge Gateway 後端服務 (Port 5400)
  backend:
    build:
      context: ./tymetro-gateway-backend
      dockerfile: Dockerfile
    container_name: tymetro-gateway-backend
    restart: always
    environment:
      - TZ=Asia/Taipei
    ports:
      - "5400:5400"
    volumes:
      # 掛載整個 backend 目錄，防止單一檔案 (gateway.yaml) FTP 覆蓋時因 Inode 變更導致容器內存舊檔問題
      - ./tymetro-gateway-backend:/app
    depends_on:
      - mosquitto
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. HVAC Edge Gateway 前端靜態網頁與 Nginx 反向代理 (Port 8000)
  frontend:
    image: nginx:alpine
    container_name: tymetro-gateway-frontend
    restart: always
    environment:
      - TZ=Asia/Taipei
    ports:
      - "8000:8080"
    volumes:
      - ./tymetro-gateway-frotend/dist:/usr/share/nginx/html
      - ./tymetro-gateway-frotend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    security_opt:
      - seccomp:unconfined
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
